<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Todo Search Example</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <script src="https://unpkg.com/petite-vue" defer init></script>

  <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre.min.css">
  <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-exp.min.css">
  <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">

  <script>
    // REST API endpoint URL
    const url = 'http://localhost:5000/search';

    // Function to perform the search query
    window.search = (query) => {
      return fetch(`${url}?term=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .catch(error => {
          console.error('Error:', error);
          return []; // Return empty array in case of error
        });
    };
  </script>
</head>
<body class="bg-gray">
  <div v-scope="{ query: '', results: [] }" class="container grid-hero grid-sm py-2">
    <div class="d-flex" style="padding-top: 50px">
      <input v-model="query" class="form-input mx-1" type="text" id="input-example-1" placeholder="Search..."
        @keyup.enter="search(query).then(data => results = data)"
      >
      <button class="mx-1 btn btn-primary btn-action"
        @click="search(query).then(data => results = data)"
      ><i class="icon icon-search"></i></button>
    </div>
    <div class="card mx-1 my-2" v-for="result in results" :key="result.todo_title">
      <h4 class="card-header">{{ result.todo_title }}</h4>
      <p class="card-body">{{ result.todo_content.length < 1000 ? result.todo_content : result.todo_content.substring(0, 1000) + '...' }}</p>
      <p class="card-footer">Rank: {{ result.rank }}</p>
    </div>
  </div>
</body>
</html>
